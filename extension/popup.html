<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 250px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; color: #111827; }
      h1 { margin: 0 0 10px; font-size: 16px; }
      button { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; border-radius: 6px; background: #dc2626; color: white; }
      button.recording { background: #374151; }
      button:disabled { opacity: 0.6; cursor: default; }
      p { margin: 10px 0 0; font-size: 12px; line-height: 1.4; color: #4b5563; }
      .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #9ca3af; }
      .dot.on { background: #10b981; }
      .dot.waiting { background: #f59e0b; }
      @media (prefers-color-scheme: dark) {
        body { background: #1f2937; color: #f9fafb; }
        p { color: #d1d5db; }
        button.recording { background: #4b5563; }
      }
    </style>
  </head>
  <body>
    <h1>⏪ Rewind</h1>
    <button id="toggle">Start recording</button>
    <p id="status">Not recording</p>
    <p id="server"><span class="dot" id="dot"></span><span id="serverText">Editor not connected</span></p>
    <script src="popup.js"></script>
  </body>
</html>
